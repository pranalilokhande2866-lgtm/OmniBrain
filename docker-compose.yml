# Optional: a real Qdrant server, for when you outgrow local/embedded
# mode (e.g. you want the vector DB to persist independently of the
# backend process, or run ingestion and the API as separate processes).
#
# Usage:
#   docker compose up -d
#   # then set QDRANT_URL=http://localhost:6333 in your .env
#
# Not required for local development - by default (QDRANT_URL unset
# in .env) the app uses Qdrant's embedded local mode and writes to
# data/qdrant_storage/ directly, no Docker needed.

services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
